<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2d47" />
  <title>ذال العقارية | القطعة 236</title>

  <style>
    :root {
      --navy: #0b2d47;
      --navy-2: #123b5f;
      --gold: #c8a25a;
      --gold-soft: #efe4cb;
      --text: #22313f;
      --muted: #66717b;
      --bg: #f6f3ed;
      --card: #ffffff;
      --line: rgba(11, 45, 71, 0.08);
      --shadow: 0 10px 35px rgba(11, 45, 71, 0.10);
      --green: #1fc94e;
      --green-2: #10b83f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(200,162,90,0.14), transparent 24%),
        radial-gradient(circle at top left, rgba(11,45,71,0.05), transparent 20%),
        var(--bg);
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .page {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 18px 14px 0;
    }

    .hero {
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.92));
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 28px;
      padding: 26px 18px 18px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      top: 0;
      width: 110px;
      height: 100%;
      opacity: 0.06;
      background:
        linear-gradient(135deg, transparent 30%, var(--navy) 30%, var(--navy) 34%, transparent 34%);
      pointer-events: none;
    }

    .hero::before {
      left: -25px;
    }

    .hero::after {
      right: -25px;
      transform: scaleX(-1);
    }

    .logo {
      width: 150px;
      max-width: 60%;
      height: auto;
      display: block;
      margin: 0 auto 16px;
    }

    .top-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 26px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f6efde, #efe2c0);
      color: #8a6a2f;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
      border: 1px solid rgba(200,162,90,0.25);
    }

    .title {
      margin: 0;
      color: var(--navy);
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .title .num {
      color: var(--gold);
      margin-inline-start: 6px;
    }

    .subtitle {
      margin: 14px 0 0;
      color: #5d6670;
      font-size: clamp(17px, 3.5vw, 22px);
      line-height: 1.8;
    }

    .map-card {
      margin-top: 18px;
      background: var(--card);
      border-radius: 24px;
      padding: 10px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .map-card img {
      width: 100%;
      display: block;
      border-radius: 18px;
      background: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
      margin-bottom: 10px;
    }

    .stat {
      background: var(--card);
      border-radius: 22px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 18px 16px 16px;
      text-align: center;
    }

    .stat .icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3ecdc;
      color: var(--gold);
      font-size: 34px;
      font-weight: 700;
    }

    .stat .label {
      display: block;
      color: #6a727a;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .stat .value {
      color: var(--navy);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
    }

    .stat .unit {
      color: #6a727a;
      font-size: 14px;
      margin-top: 4px;
    }

    .actions {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 620px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(7, 30, 48, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      box-shadow: 0 -8px 28px rgba(0,0,0,0.14);
      z-index: 999;
    }

    .btn {
      min-height: 62px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      transition: transform .15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex: 0 0 auto;
    }

    .btn.whatsapp {
      background: linear-gradient(180deg, var(--green), var(--green-2));
    }

    .btn.call {
      background: linear-gradient(180deg, #123e67, #0b2d47);
    }

    @media (max-width: 420px) {
      .title {
        font-size: 30px;
      }

      .subtitle {
        font-size: 16px;
      }

      .stat .value {
        font-size: 24px;
      }

      .btn {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <main class="page">

    <section class="hero">
      <img src="logo.png" alt="ذال العقارية" class="logo" />

      <div class="top-tag">للاستثمار</div>

      <h1 class="title">
        القطعة رقم <span class="num">236</span>
      </h1>

      <p class="subtitle">
        تفاصيل القطعة موضحة في المخطط أدناه
      </p>

      <div class="map-card">
        <img src="photo.jpg.png" alt="مخطط القطعة 236" />
      </div>

      <div class="stats">
        <div class="stat">
          <div class="icon">#</div>
          <span class="label">رقم القطعة</span>
          <div class="value">236</div>
        </div>

        <div class="stat">
          <div class="icon">□</div>
          <span class="label">المساحة</span>
          <div class="value">1125.01</div>
          <div class="unit">م²</div>
        </div>
      </div>
    </section>

  </main>

    </a>

    <a

  </nav>

</body>
</html>
